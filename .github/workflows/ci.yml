name: serchX CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only one run per branch/tag at a time; cancel the older one on new push.
concurrency:
  group: serchx-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 – Tests (runs on every PR and push to main)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  test:
    name: Rust checks
    runs-on: macos-latest          # macOS-only: cocoa, objc, llama-cpp Metal
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # rust-version in Cargo.toml is 1.82; stable will be ≥ that
          components: rustfmt, clippy

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # llama-cpp-2 (Metal build) requires cmake at link time
      - name: Install CMake
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      # Run Clippy before tests for fast feedback on compiler/lint issues
      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        working-directory: src-tauri
        # --locked enforces the committed Cargo.lock (already tracked in git)
        run: cargo test --locked

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 – Build unsigned macOS app + DMG
# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build macOS app & DMG
    needs: test
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install CMake
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi

      # Install pre-compiled Tauri CLI binary via npm for fast setup (avoids compiling CLI from source)
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build app and DMG
        working-directory: src-tauri
        # Targets declared in tauri.conf.json bundle.targets are ["app","dmg"]
        run: tauri build --bundles app,dmg

      # Zip the .app (GitHub Artifacts can't store raw directories)
      - name: Package artefacts for upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          APP="$(find src-tauri/target/release/bundle -type d -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "ERROR: No .app bundle was produced" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/serchX-macos.zip

          find src-tauri/target/release/bundle/dmg \
            -maxdepth 1 -type f -name '*.dmg' \
            -exec cp {} dist/ \;

          echo "=== dist/ contents ===" && ls -lh dist/

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: serchX-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 14

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 – Publish GitHub Release (only on v* tags)
# ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write   # needed to create/update releases

    steps:
      - name: Download build artefacts
        uses: actions/download-artifact@v4
        with:
          name: serchX-macos
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true   # auto-generates changelog from commits
          files: dist/*
